spring:
  application:
    name: ApiGateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true
      # Routes below are local fallback.
      # When Config Server is available, ApiGateway.yml in ConfigService overrides them
      # and uses lb:// URIs resolved via Eureka.
      routes:

        # Public: signup & login (no JWT required)
        - id: auth-public
          # in this uri we can write "uri: lb://UserService", eurka will find the ip
          uri: lb://${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /users/${segment}

        # Protected: user profile endpoints
        - id: user-service
          uri: lb://${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter
            - RewritePath=/api/users/(?<segment>.*), /users/${segment}

        # Public: product reads
        - id: product-public-list
          uri: lb://${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products
            - Method=GET

        - id: product-public-detail
          uri: lb://${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/{id}
            - Method=GET

        # Protected: product CRUD
        - id: product-protected
          uri: lb://${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
            - Method=POST,PUT,DELETE
          filters:
            - JwtAuthFilter

        # Public: serve/view media files (like a CDN link — <img src> can't attach a JWT)
        - id: media-public-serve
          uri: lb://${MEDIA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/media/{id}
            - Method=GET

        # Protected: media upload / delete
        - id: media-service
          uri: lb://${MEDIA_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/media/**
          filters:
            - JwtAuthFilter

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

# Eureka (fallback if Config Server unavailable)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
