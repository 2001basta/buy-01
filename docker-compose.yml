services:

  # =========================
  # Database
  # =========================
  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Message Broker
  # KRaft - No Zookeeper
  # =========================
  kafka:
    image: apache/kafka:3.7.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # =========================
  # Distributed Tracing
  # =========================
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"


  # =========================
  # Config Server
  # =========================
  config-server:
    build: ./ConfigService
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s


  # =========================
  # Eureka Discovery Server
  # =========================
  discovery-service:
    build: ./DiscoveryService
    ports:
      - "8761:8761"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      config-server:
        condition: service_healthy


  # =========================
  # User Service
  # =========================
  user-service:
    build: ./UserService
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/userdb

      JWT_SECRET: ${JWT_SECRET}

      CONFIG_SERVER_URL: http://config-server:8888

      EUREKA_SERVER_URL: http://discovery-service:8761/eureka

      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      mongodb:
        condition: service_healthy

      config-server:
        condition: service_healthy

      discovery-service:
        condition: service_healthy

    restart: on-failure


  # =========================
  # Media Service
  # =========================
  media-service:
    build: ./MediaService
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/mediadb

      JWT_SECRET: ${JWT_SECRET}

      UPLOAD_DIR: /uploads

      CONFIG_SERVER_URL: http://config-server:8888

      EUREKA_SERVER_URL: http://discovery-service:8761/eureka

      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    volumes:
      - media-uploads:/uploads

    depends_on:
      mongodb:
        condition: service_healthy

      config-server:
        condition: service_healthy

      discovery-service:
        condition: service_healthy

    restart: on-failure


  # =========================
  # Product Service
  # =========================
  product-service:
    build: ./ProductService
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/productdb

      JWT_SECRET: ${JWT_SECRET}

      MEDIA_SERVICE_URL: http://media-service:8083

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      CONFIG_SERVER_URL: http://config-server:8888

      EUREKA_SERVER_URL: http://discovery-service:8761/eureka

      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    depends_on:
      mongodb:
        condition: service_healthy

      kafka:
        condition: service_healthy

      config-server:
        condition: service_healthy

      discovery-service:
        condition: service_healthy

    restart: on-failure


  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build: ./ApiGateway
    ports:
      - "8443:8443"
    environment:
      JWT_SECRET: ${JWT_SECRET}

      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/app/certs/gateway-keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${SERVER_SSL_KEY_STORE_PASSWORD:-changeit}

      USER_SERVICE_URL: http://user-service:8081

      PRODUCT_SERVICE_URL: http://product-service:8082

      MEDIA_SERVICE_URL: http://media-service:8083

      CONFIG_SERVER_URL: http://config-server:8888

      EUREKA_SERVER_URL: http://discovery-service:8761/eureka

      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans

    volumes:
      - ./certs/gateway-keystore.p12:/app/certs/gateway-keystore.p12:ro

    depends_on:
      config-server:
        condition: service_healthy

      discovery-service:
        condition: service_healthy

      user-service:
        condition: service_started

      product-service:
        condition: service_started

      media-service:
        condition: service_started

    restart: on-failure


# =========================
# Volumes
# =========================
volumes:
  mongo-data:
  media-uploads: